<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicking Simulator Deluxe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    #counter {
      font-size: 2rem;
      margin: 20px 0;
    }

    button {
      background: #00bcd4;
      border: none;
      color: #fff;
      padding: 15px 40px;
      font-size: 1.3rem;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      margin: 5px;
    }

    button:hover {
      background: #0097a7;
      transform: scale(1.05);
    }

    #upgrade, #autoclick {
      background: #4caf50;
    }

    #upgrade:hover, #autoclick:hover {
      background: #388e3c;
    }

    #status {
      margin-top: 20px;
      font-size: 1.1rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>Clicking Simulator Deluxe</h1>
  <div id="counter">Clicks: 0</div>
  <button id="clickBtn">Click!</button>
  <div>
    <button id="upgrade">Buy Upgrade (Cost: 50)</button>
    <button id="autoclick">Buy Auto-Clicker (Cost: 100)</button>
  </div>
  <div id="status"></div>

  <script>
    // Load saved state
    let clicks = parseInt(localStorage.getItem("clicks")) || 0;
    let clickPower = parseInt(localStorage.getItem("clickPower")) || 1;
    let autoClickers = parseInt(localStorage.getItem("autoClickers")) || 0;
    const counter = document.getElementById("counter");
    const clickBtn = document.getElementById("clickBtn");
    const upgradeBtn = document.getElementById("upgrade");
    const autoClickBtn = document.getElementById("autoclick");
    const status = document.getElementById("status");

    function updateCounter() {
      counter.textContent = `Clicks: ${clicks}`;
      localStorage.setItem("clicks", clicks);
      localStorage.setItem("clickPower", clickPower);
      localStorage.setItem("autoClickers", autoClickers);
    }

    clickBtn.addEventListener("click", () => {
      clicks += clickPower;
      updateCounter();
      animateClick();
    });

    upgradeBtn.addEventListener("click", () => {
      if (clicks >= 50) {
        clicks -= 50;
        clickPower++;
        status.textContent = `Upgrade purchased! Click power: ${clickPower}`;
      } else {
        status.textContent = "Not enough clicks!";
      }
      updateCounter();
    });

    autoClickBtn.addEventListener("click", () => {
      if (clicks >= 100) {
        clicks -= 100;
        autoClickers++;
        status.textContent = `Auto-clicker purchased! You now have ${autoClickers}`;
      } else {
        status.textContent = "Not enough clicks!";
      }
      updateCounter();
    });

    // Auto-click every second
    setInterval(() => {
      if (autoClickers > 0) {
        clicks += autoClickers * clickPower;
        updateCounter();
      }
    }, 1000);

    // Simple click animation
    function animateClick() {
      clickBtn.style.transform = "scale(1.2)";
      setTimeout(() => {
        clickBtn.style.transform = "scale(1)";
      }, 100);
    }

    updateCounter();
  </script>
</body>
</html>
